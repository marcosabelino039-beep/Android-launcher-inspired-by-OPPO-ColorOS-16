
name: Build ColorOS16 Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/coloros-project
          unzip -o ColorOS16-Launcher-project.zip -d /tmp/coloros-project
          cp -r /tmp/coloros-project/. .
          cp -r .launcher-overrides/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS16-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
